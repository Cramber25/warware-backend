services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    environment:
      DOCKER_API_VERSION: ${DOCKER_API_VERSION}
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.forwardedHeaders.insecure=true"
    ports:
      - "127.0.0.1:${BACKEND_PORT}:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - default

  db:
    image: postgres:16-alpine
    container_name: roblox_store_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: roblox_store_redis
    restart: unless-stopped
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=warware_net'
      - 'traefik.http.routers.warware_api.entrypoints=web'
      - 'traefik.http.routers.warware_api.rule=PathPrefix(`/api`) || PathPrefix(`/oauth2`) || PathPrefix(`/login`) || PathPrefix(`/logout`) || PathPrefix(`/asset`)'
      - 'traefik.http.services.warware_api.loadbalancer.server.port=8080'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/assets"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      DISCORD_BOT_ENABLED: "false"
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY: ${R2_ACCESS_KEY}
      R2_SECRET_KEY: ${R2_SECRET_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_PUBLIC_BUCKET_NAME: ${R2_PUBLIC_BUCKET_NAME}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      ROBLOX_WEBHOOK_KEY: ${ROBLOX_WEBHOOK_KEY}
      FRONTEND_URL: ${FRONTEND_URL}
      BACKEND_URL: ${BACKEND_URL}
      ROBLOX_CLIENT_ID: ${ROBLOX_CLIENT_ID}
      ROBLOX_CLIENT_SECRET: ${ROBLOX_CLIENT_SECRET}
      VPNAPI_KEY: ${VPNAPI_KEY}
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      DISCORD_BOT_ENABLED: "true"
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID}
      FRONTEND_URL: ${FRONTEND_URL}
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres_data:
networks:
  default:
    name: warware_net
    external: true